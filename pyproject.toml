[project]
name = "hydrospectral"
version = "0.2.0"
description = "Exploring aquatic ecosystems through hyperspectral imaging, Earth observation, environmental foundation models, and reproducible computational experiments."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Thanakrit Wongsatit" }]
dependencies = [
    "jsonschema>=4.21",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scipy>=1.12",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.5"]
pace = ["h5py>=3.10"]
geo = ["rasterio>=1.4"]
viz = ["matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hydrospectral"]

[tool.hatch.build.targets.wheel.force-include]
"config/qc_thresholds.yaml" = "hydrospectral/_bundled/qc_thresholds.yaml"
"schemas/source_manifest.schema.json" = "hydrospectral/_bundled/source_manifest.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -ra"
xfail_strict = true

[dependency-groups]
dev = [
    "pytest>=8.0",
]
