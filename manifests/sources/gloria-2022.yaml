notes: >
  PANGAEA.948492 distributes the archive as GLORIA-2022.zip without a separate
  internal version field in the CSV tables, so version_string is recorded as
  'not declared'. Expected SHA-256 and record_count (7,572 spectra) are carried
  from the 2026-11-25 research handoff; digest_verified stays false until
  recomputed against a locally staged archive in this workspace. Key caveats:
  join strictly on GLORIA_ID; 1 nm grid (350-900 nm) is interpolated from
  instruments with 1-10 nm native resolution (median 4.9 nm); rivers are only
  3.3% (249/7572) with zero Thai observations; CSV audit shows 30 country
  labels vs 31 reported in the paper; missing QC flags indicate unmeasured
  wavelengths rather than passed tests; Lake Geneva Thetis profiler Chla values
  are optically inferred and must be isolated from reflectance-to-Chla
  benchmarks to avoid target circularity.
