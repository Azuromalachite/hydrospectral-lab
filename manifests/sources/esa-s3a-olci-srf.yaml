notes: >
  Official ESA Sentinel-3A OLCI mean Relative Spectral Response NetCDF-4/HDF5
  dataset (OLCI_S3A_spectral_model_v7.02_fltrd_20160713.nc4, 21 bands x 200
  per-band wavelength samples). SHA-256 and exact byte size (47,804 bytes)
  verified locally on 2026-11-28. Real-file support finding for HS-R02 A03:
  across the 15 in-window bands Oa02-Oa16, peak-normalized 200-point window
  endpoints span 1.20e-8 to 8.57e-8 (across all 21 bands Oa01-Oa21: 8.64e-9 on
  Oa17 to 3.64e-7 on Oa21, and 1.01e-7 on Oa01), so support_rel_tol=1e-8 or
  literal R>0 rejects all 21 bands on [400, 800] nm (Oa02-Oa16 fail the
  interior-endpoint check while Oa01 and Oa17-Oa21 extend outside [400, 800]
  nm). At support_rel_tol=1e-6 (1 ppm of peak), Oa02-Oa16 ([402.53, 791.12] nm,
  15 bands) pass cleanly while Oa01 ([387.75, 411.30] nm) and Oa17-Oa21
  ([851.20, 1043.77] nm) are cleanly excluded. Trapezoidal effective
  wavelengths match ESA's srf_centre_wavelength to <=0.01 nm across Oa02-Oa16.
  Oa13-Oa15 (761.25-767.50 nm, FWHM 2.6-3.7 nm) overlap the ~762 nm O2 A-band
  and exhibit up to ~22.7% p95 discrepancy against rectangular boxcars.
