notes: >
  Official ESA Copernicus S2-SRF spreadsheet (COPE-GSEG-EOPG-TN-15-0007 v5.0;
  sheets 'Spectral Responses (S2A)', 'Spectral Responses (S2B)', and
  'Spectral Responses (S2C)', 1 nm grid from 300 to 2600 nm, 2,301 rows).
  SHA-256 and exact byte size (1,330,493 bytes) verified locally on 2026-11-28.
  Support audit on [400, 800] nm via hydrospectral.srf.build_srf_weight_matrix:
  S2A bands B1-B7 ([430, 456] nm through [770, 797] nm) are strictly contained
  inside [400, 800] nm under all tested tolerances (0.0, 1e-8, 1e-6); B8
  ([775, 906] nm) and B8A-B12 extend outside [400, 800] nm and are rejected.
  Cross-check against COPE-GSEG-EOPG-TN-15-0007 v4.0 (1,339,179 bytes,
  SHA-256 1a9edc27d692a570911a460d589f188da0fc3e27f0b0bd1ad322059c380519b0):
  S2A curves differ by up to ~0.00943 in response amplitude, producing <=0.036%
  median (<=0.084% p95) relative Rrs difference across GLORIA Chla (n=2,840).
